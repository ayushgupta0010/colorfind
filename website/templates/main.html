<!DOCTYPE html>
<html>
    <head>
        <style>
            :root{
                --primary-color: #95a8d6;
            }

            html, body{
                min-height: 100;
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif
            }

            html{
                background-color: var(--primary-color);
                background: linear-gradient(to bottom,var(--primary-color) 0%, rgb(0, 0, 0, 0.75) 100%);
            }

            img{
                max-height: 100%;
                max-width: 100%
            }

            div{
                background-color: rgb(0, 0, 0, 0.25);
                padding: 2.5%;
                border-radius: 20px;
                border: 1px solid black;
                box-shadow: 1px 1px black;
            }

            .main{
                margin: 2% 5%;
                display: flex;
                text-align: center;
                flex-direction: column;
            }

            .inputs{
                display: flex;
                flex-direction: row;
                flex: 1 1 0;
                justify-content: space-between;
            }

            .pictureSelect{
                flex-direction: column;
                display: flex;
                width: 65%;
            }

            .settings{
                width: 20%;
                display: flex;
                flex-direction: column;
            }

            .submitButton{
                font-size: 150%;
                width: 100%;
                margin: 5% 0px;
            }

            .selectColorblindness{
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                height: 100%;
            }

            .colorSelector{
                bottom: 0;
                left: 0;
                position: static;
            }

            .active{
                border: 3px solid red;
            }

            input[type="file"], input[type="submit"], button, p, a{
                padding: 2.5%;
                background-color: rgba(255, 255, 255, 0.25);
                border-radius: 20px;
                cursor: pointer;
                border: 1px solid black;
                box-shadow: 1px 1px black;
                transition: .5s all
            }

            input[type="file"]:hover, input[type="submit"]:hover, button:hover, a:hover{
                background-color: rgba(255, 255, 255, 0.15);
            }

            a{
                text-decoration: none;
                color: black;
            }

            .preview{
                height: 250px;
                margin-left: auto;
                margin-right: auto;
            }

            .fileInput{
                padding: 2.5%;
                background-color: rgba(255, 255, 255, 0.25);
                margin: 0;
                margin-top: 5%;
            }

            .side2side{
                display: flex; 
                flex-direction: row; 
                justify-content: space-between;
            }

            .hidden{
                display: none;
            }
            
        </style>
        <script>
            let currentColorblindnessType = null;
            let currentColorblindnessInput = null;
            let image = null;
            let intervals = []

            function onLoad(){
                const root = document.documentElement
                const style = getComputedStyle(root)
                const primaryColor = style.getPropertyValue("--primary-color")
                document.getElementById("colorSelector").value = primaryColor
                
                document.getElementById('formInput').onsubmit = function(event) {
                    event.preventDefault(); 
                    image = document.getElementById("fileInput").files[0]
                    if(!currentColorblindnessType){alert("Please choose a colorblindness type!"); return}
                    if(!image){alert("Please select an image!"); return}

                    let data = new FormData()
                    data.set("my_image", image)
                    data.set("colorblindnessType", currentColorblindnessType)
             
                    const res = fetch('/uploads', {
                        method: 'POST',
                        body: data
                    })
                    .then(x => x.text())
                    .then(data => showOutput(data))
                  
                };

                changeColorColors()
            }

            function showOutput(imgPath){
                let outputDiv = document.getElementById("outputDiv")
                if(outputDiv.classList.contains("hidden")){
                    outputDiv.classList.remove("hidden")
                }

                let outputImg = document.getElementById("outputImage")
                outputImg.src = imgPath

                let outputImageLink = document.getElementById("outputImageLink")
                outputImageLink.href = imgPath
            }

            function changePreview(files){
                let file = files[0]
                let src = URL.createObjectURL(file)
                document.getElementById("preview").src = src
                let sizeShower = document.getElementById("sizeShower")
                let size = file["size"]
                sizeShower.innerHTML = `Size: ${returnFileSize(size)}`
            
            }
            
            function changeCBType(input){
                if(currentColorblindnessInput){
                    currentColorblindnessInput.classList.remove("active")
                }

                currentColorblindnessInput = input
                currentColorblindnessType = input.innerHTML

                currentColorblindnessInput.classList.add("active")
            }

            function changeBGColor(input){
                let color = input.value
                let html = document.getElementsByTagName("html")[0]
                html.style.backgroundColor = color
                html.style.background = `linear-gradient(to bottom,${color} 0%, rgb(0, 0, 0, 0.75) 100%);`
                
            }

            function changeColorColors(){
                // red green blue purple orange yellow

                let colors = [
                    "#FF2424",
                    "#24FF41",
                    "#2824FF",
                    "#B624FF",
                    "#FFA024",
                    "#FFF824"
                ]

                colors.reverse()

                let colorsLength = colors.length

                let C = 4
                let O = 3
                let l = 2
                let o = 1
                let R = 0

                let time = 200     
                
                intervals.push(setInterval(function(){
                    if(R == colorsLength){
                        R = 0
                    }
                    document.getElementById("R").style.color = colors[R]
                    R++
                }, time))
                
                intervals.push(setInterval(function(){
                    if(o == colorsLength){
                        o = 0
                    }
                    document.getElementById("o").style.color = colors[o]
                    o++
                }, time))
                
                intervals.push(setInterval(function(){
                    if(l == colorsLength){
                        l = 0
                    }
                    document.getElementById("L").style.color = colors[l]
                    l++
                }, time))

                intervals.push(setInterval(function(){
                    if(O == colorsLength){
                        O = 0
                    }
                    document.getElementById("O").style.color = colors[O]
                    O++
                }, time)) 

                intervals.push(setInterval(function(){
                    if(C == colorsLength){
                        C = 0
                    }
                    document.getElementById("C").style.color = colors[C]
                    C++
                }, time))     
            }

            function changeFun(html){
                let isFun = html.classList.contains("fun")
                if(isFun){
                    html.classList.remove("fun") // thanks ayush
                    html.src = "https://img.favpng.com/10/13/15/emoji-smiley-emoticon-blank-expression-feeling-png-favpng-QG1nN4Gb5usaMCEwPnezutaGr.jpg"
                    for(interval of intervals){
                        clearInterval(interval)
                        document.getElementById("C").style.color = "black"
                        document.getElementById("O").style.color = "black"
                        document.getElementById("L").style.color = "black"
                        document.getElementById("o").style.color = "black"
                        document.getElementById("R").style.color = "black"
                    }
                }
                else{
                    html.classList.add("fun") // oh yeah
                    html.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3n7RJsVjb1dCE8z44G-pM0V8HQQyWATW3CQ&s"
                    changeColorColors()
                }
            }

            function returnFileSize(number) { // thank you https://developer.mozilla.org
                if (number < 1e3) {
                    return `${number} bytes`;
                } else if (number >= 1e3 && number < 1e6) {
                    return `${(number / 1e3).toFixed(1)} KB`;
                }
                return `${(number / 1e6).toFixed(1)} MB`;
            }

        </script>
    </head>
    <body onload="onLoad()">
        <input type="color" id="colorSelector" class="colorSelector" onchange="changeBGColor(this)">
        <img style="margin-bottom: -20px; width: 50px; height: 50px; top: 50px; left: 150px; position: static; cursor: pointer;" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3n7RJsVjb1dCE8z44G-pM0V8HQQyWATW3CQ&s" onclick="changeFun(this)" class="fun" id="funSelector"></img>
        <div class="main">
            <h1 style="font-size: 300%; margin-top: 0px;"><span id="C">C</span><span id="O">o</span><span id="L">l</span><span id="o">o</span><span id="R">r</span><span>Find</span></h1>
            <form id="formInput" action="/uploads" method="POST" enctype="multipart/form-data">
                <main class="inputs">
                    <div class="pictureSelect">
                        <img class="preview" id="preview"/>
                        <section class="side2side">
                            <input name="my_image" class="fileInput" id="fileInput" onchange="changePreview(this.files)" style="width: 70%" accept="image/*" type="file">
                            <p style="width: 15%" class="fileInput" id="sizeShower"></p>
                        </section>
                    </div>
                    <div class="settings">
                        <h2>Select Your Colorblindness Type</h2>
                        <section class="selectColorblindness">
                            <button type="button" onclick="changeCBType(this)" style="background-color: lightpink;">Protan</button>
                            <button type="button" onclick="changeCBType(this)" style="background-color: lightgreen;">Deutan</button>
                            <button type="button" onclick="changeCBType(this)" style="background-color: lightblue;">Tritan</button>
                        </section>
                        <hr style="width: 100%">
                        <a href="https://enchroma.com/pages/color-blindness-test" style="padding: .5%; border-radius: 0px" target="_blank">Don't know what you are? Take Colorblindness Test!</a>
                    </div>
                </main>
                <input value="Convert Image" class="submitButton" type="submit">
            </form>
            <div id="outputDiv" class="hidden">
                <h2>Output</h2>
                <img id="outputImage" class="preview">
                <section class="side2side" style="justify-content: center;">
                    <a download id="outputImageLink">Click here to download image!</a>
                </section>
            </div>
        </div>
    </body>
</html>
