<!DOCTYPE html>
<html>
    <head>
        <style>
            :root{
                --primary-color: #95a8d6;
            }

            html{
                background-color: var(--primary-color);
            }

            html, body{
                height: 120%;
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif
            }

            img{
                max-height: 100%;
                max-width: 100%
            }

            div{
                background-color: rgb(0, 0, 0, 0.25);
                padding: 2.5%;
                border-radius: 20px;
                border: 1px solid black;
                box-shadow: 1px 1px black;
            }

            .main{
                margin: 2% 5%;
                display: flex;
                text-align: center;
                flex-direction: column;
            }

            .inputs{
                display: flex;
                flex-direction: row;
                flex: 1 1 0;
                justify-content: space-between;
            }

            .pictureSelect{
                flex-direction: column;
                display: flex;
                width: 65%;
            }

            .settings{
                width: 20%;
                display: flex;
                flex-direction: column;
            }

            .submitButton{
                font-size: 150%;
                width: 100%;
                margin: 5% 0px;
            }

            .selectColorblindness{
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                height: 100%;
            }

            .colorSelector{
                bottom: 0;
                left: 0;
                position: static;
            }

            .active{
                border: 3px solid red;
            }

            input[type="file"], input[type="submit"], button, p, a{
                padding: 2.5%;
                background-color: rgba(255, 255, 255, 0.25);
                border-radius: 20px;
                cursor: pointer;
                border: 1px solid black;
                box-shadow: 1px 1px black;
            }

            a{
                text-decoration: none;
                color: black;
            }

            .preview{
                height: 250px;
                margin-left: auto;
                margin-right: auto;
            }

            .fileInput{
                padding: 2.5%;
                background-color: rgba(255, 255, 255, 0.25);
                margin: 0;
                margin-top: 5%;
            }

            .side2side{
                display: flex; 
                flex-direction: row; 
                justify-content: space-between;
            }

            .hidden{
                display: none;
            }
            
        </style>
        <script>
            let currentColorblindnessType = null;
            let currentColorblindnessInput = null;
            let image = null;

            function onLoad(){
                const root = document.documentElement
                const style = getComputedStyle(root)
                const primaryColor = style.getPropertyValue("--primary-color")
                document.getElementById("colorSelector").value = primaryColor
                
                document.getElementById('formInput').onsubmit = function(event) {
                    event.preventDefault(); 
                    image = document.getElementById("fileInput").files[0]
                    if(!currentColorblindnessType){alert("Please choose a colorblindness type!"); return}
                    if(!image){alert("Please select an image!"); return}

                    let data = new FormData()
                    data.set("my_image", image)
                    data.set("colorblindnessType", currentColorblindnessType)
             
                    const res = fetch('/uploads', {
                        method: 'POST',
                        body: data
                    })
                    .then(x => x.text())
                    .then(data => showOutput(data))
                  
                };
            }

            function showOutput(imgPath){
                let outputDiv = document.getElementById("outputDiv")
                if(outputDiv.classList.contains("hidden")){
                    outputDiv.classList.remove("hidden")
                }

                let outputImg = document.getElementById("outputImage")
                outputImg.src = imgPath

                let outputImageLink = document.getElementById("outputImageLink")
                outputImageLink.href = imgPath
            }
            
            function sendDaltonizeRequest(e){
                console.log(e)
                e.preventDefault()
            }

            function changePreview(files){
                let file = files[0]
                let src = URL.createObjectURL(file)
                document.getElementById("preview").src = src
                let sizeShower = document.getElementById("sizeShower")
                let size = file["size"]
                sizeShower.innerHTML = `Size: ${returnFileSize(size)}`
            
            }
            
            function changeCBType(input){
                if(currentColorblindnessInput){
                    currentColorblindnessInput.classList.remove("active")
                }

                currentColorblindnessInput = input
                currentColorblindnessType = input.innerHTML

                currentColorblindnessInput.classList.add("active")
            }

            function changeBGColor(input){
                let color = input.value
                document.getElementsByTagName("html")[0].style.backgroundColor = color
            }

            function returnFileSize(number) { // thank you https://developer.mozilla.org
                if (number < 1e3) {
                    return `${number} bytes`;
                } else if (number >= 1e3 && number < 1e6) {
                    return `${(number / 1e3).toFixed(1)} KB`;
                }
                return `${(number / 1e6).toFixed(1)} MB`;
            }

        </script>
    </head>
    <body onload="onLoad()">
        <input type="color" id="colorSelector" class="colorSelector" onchange="changeBGColor(this)">
        <div class="main">
            <h1>ColorFind</h1>
            <form id="formInput" action="/uploads" method="POST" enctype="multipart/form-data">
                <main class="inputs">
                    <div class="pictureSelect">
                        <img class="preview" id="preview"/>
                        <section class="side2side">
                            <input name="my_image" class="fileInput" id="fileInput" onchange="changePreview(this.files)" style="width: 70%" accept="image/*" type="file">
                            <p style="width: 15%" class="fileInput" id="sizeShower"></p>
                        </section>
                    </div>
                    <div class="settings">
                        <h2>Select Your Colorblindness Type</h2>
                        <section class="selectColorblindness">
                            <button type="button" onclick="changeCBType(this)" style="background-color: lightpink;">Protan</button>
                            <button type="button" onclick="changeCBType(this)" style="background-color: lightgreen;">Deutan</button>
                            <button type="button" onclick="changeCBType(this)" style="background-color: lightblue;">Tritan</button>
                        </section>
                    </div>
                </main>
                <input value="Convert Image" class="submitButton" type="submit">
            </form>
            <div id="outputDiv" class="hidden">
                <h2>Output</h2>
                <img id="outputImage" class="preview">
                <section class="side2side" style="justify-content: center;">
                    <a download id="outputImageLink">Click here to download image!</a>
                </section>
            </div>
        </div>
    </body>
</html>
